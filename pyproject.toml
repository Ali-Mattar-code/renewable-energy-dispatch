[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renewable-energy-dispatch"
version = "1.0.0"
description = "Hybrid solar, battery and biogas capacity-planning, dispatch and feasibility engine."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ali Mattar"}]
dependencies = [
  "fastapi>=0.115,<1",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "scipy>=1.14,<2",
  "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
app = ["streamlit>=1.39,<2"]
dev = ["pytest>=8.3,<9", "ruff>=0.7,<1"]

[project.scripts]
hybrid-dispatch = "hybrid_dispatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
